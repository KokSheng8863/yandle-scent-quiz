<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YANDLE Scent Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#E6DFD2;--ink:#6B5440;--muted:#7A6650;--line:#C8BDA9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:15px;line-height:1.7;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:32px 24px 64px;min-height:100vh}
h1,h2,h3{font-family:'Archivo',Helvetica,Arial,sans-serif;margin:0;color:var(--ink)}
h1{font-weight:800;font-size:clamp(4.4rem,23vw,8.2rem);line-height:.84;letter-spacing:-.04em;text-transform:uppercase}
h2{font-weight:700;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.12;letter-spacing:-.02em;margin-bottom:28px}
p{margin:0 0 14px;max-width:44ch}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:56px}
.logo{display:block;height:24px;width:auto}
.lang{display:flex;border:1px solid var(--ink);flex:none}
.lb{background:transparent;color:var(--ink);border:0;padding:6px 12px;font:inherit;font-size:.8rem;letter-spacing:.04em}
.lb.on{background:var(--ink);color:var(--bg)}
.lb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
html[lang="zh"] body,html[lang="zh"] h1,html[lang="zh"] h2,html[lang="zh"] .picks b{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif}
html[lang="zh"] h1{line-height:1.05;letter-spacing:0}
html[lang="zh"] h2,html[lang="zh"] .picks b{letter-spacing:0}
.lead{margin:30px 0 36px}
.bottle{display:block;width:54px;height:auto;margin:34px 0 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:0;padding:14px 28px;letter-spacing:.04em;text-decoration:none}
.btn:hover{background:transparent;color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.ghost:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ghost{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px 0}
.bar{height:1px;background:var(--line);margin-bottom:12px}
.bar i{display:block;height:3px;margin-top:-1px;width:0;background:var(--ink);transition:width .3s}
.count{color:var(--muted);font-size:.85rem;margin-bottom:34px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:15px 16px;transition:background .12s,color .12s}
.opt:hover,.opt:active{background:var(--ink);color:var(--bg)}
.opt.sel{background:var(--ink);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.navbtn{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:12px 22px}
.navbtn:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.navbtn:disabled{opacity:.3;cursor:default}
.navbtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.hidden{display:none}
.result{border-top:1px solid var(--ink);padding-top:26px}
.result h2{font-weight:800;font-size:clamp(2.6rem,12vw,4rem);line-height:.95;text-transform:uppercase;letter-spacing:-.03em;margin-bottom:14px}
.notes{color:var(--muted);margin-bottom:20px}
.picks{margin:26px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.picks li{padding:14px 0;border-bottom:1px solid var(--line)}
.picks b{display:block;font-family:'Archivo',Helvetica,Arial,sans-serif;font-size:1.55rem;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1;margin-bottom:6px}
.picks span{color:var(--muted);font-size:.9rem}
.nl{margin-top:10px;font-size:.85rem;line-height:1.6}
.picks .nl .k{color:var(--ink);font-weight:500}
.cats{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.cats .lab.soon{color:#B3261E;font-weight:500}
.cats .lab{width:100%;font-size:.8rem;color:var(--muted)}
.picks .chip{background:#D6CAB6;color:var(--ink);padding:6px 14px;font-size:.88rem;font-weight:500;letter-spacing:.02em}
.picks .chip.soon{background:transparent;color:var(--ink);border:1px dashed var(--ink);padding:5px 13px}
.also{color:var(--muted);margin-top:20px}
.actions{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin-top:30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function t(x){return (lang==="zh"&&ZH[x])?ZH[x]:x}
function ui(k){return UI[lang][k]}
function setLang(l){
  lang=l; document.documentElement.lang=(l==="zh"?"zh":"en");
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.innerHTML=ui(el.getAttribute("data-i18n"))});
  document.title=ui("doc");
  $("l-en").classList.toggle("on",l==="en"); $("l-zh").classList.toggle("on",l==="zh");
  if(!$("quiz").classList.contains("hidden")) ask();
  if(!$("out").classList.contains("hidden")) renderResult();
}
var i=0, ans=[], score={}, sex="", $=function(id){return document.getElementById(id)};
function show(id){["intro","quiz","out"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}
function ask(){
  var Q=QUESTIONS[i], last=QUESTIONS.length-1;
  $("q").textContent=t(Q.q);
  $("count").textContent=ui("qcount").replace("{n}",i+1).replace("{t}",QUESTIONS.length);
  $("fill").style.width=(i/QUESTIONS.length*100)+"%";
  var box=$("opts"); box.innerHTML="";
  Q.a.forEach(function(o){
    var b=document.createElement("button"); b.className="opt"+(ans[i]===o[1]?" sel":""); b.type="button"; b.textContent=t(o[0]);
    b.onclick=function(){ans[i]=o[1]; if(i<last){i++;ask()}else{finish()}};
    box.appendChild(b);
  });
  $("back").disabled=(i===0);
  $("next").disabled=(ans[i]===undefined);
}
$("back").onclick=function(){if(i>0){i--;ask()}};
$("next").onclick=function(){if(i<QUESTIONS.length-1){i++;ask()}else{finish()}};
function dbg(msg){
  if(location.search.indexOf("debug")>-1){$("dbg").textContent=msg;$("dbg").classList.remove("hidden")}
}
function save(f,picks){
  var url=(SUPABASE_URL||"").trim().replace(/\/+$/,""), key=(SUPABASE_KEY||"").trim();
  if(!url||!key){dbg("NOT SAVED: SUPABASE_URL or SUPABASE_KEY is empty in index.html");return}
  try{
    fetch(url+"/rest/v1/quiz_results",{method:"POST",
      headers:{"Content-Type":"application/json","apikey":key,"Prefer":"return=minimal"},
      body:JSON.stringify({sex:sex||"skip",scent_family:f.name,
        recommended_scents:picks.map(function(p){return p[0]}).join(", ")})
    }).then(function(r){
      if(r.ok){dbg("Saved to Supabase (status "+r.status+")")}
      else{r.text().then(function(t){dbg("NOT SAVED. Status "+r.status+": "+t)})}
    }).catch(function(e){dbg("NOT SAVED. Network error: "+e)});
  }catch(e){dbg("NOT SAVED: "+e)}
}
var curTop=null, curOther=null;
function finish(){
  score={}; sex="";
  ans.forEach(function(v,n){if(QUESTIONS[n].sex){sex=v}else{score[v]=(score[v]||0)+1}});
  var keys=Object.keys(FAMILIES).sort(function(a,b){return (score[b]||0)-(score[a]||0)});
  curTop=keys[0]; curOther=keys[1];
  save(FAMILIES[curTop],FAMILIES[curTop].picks);
  renderResult(); show("out");
}
function renderResult(){
  var f=FAMILIES[curTop], picks=f.picks, other=FAMILIES[curOther];
  $("rname").textContent=t(f.name); $("rnotes").textContent=t(f.notes); $("rdesc").textContent=t(f.desc);
  var ul=$("rpicks"); ul.innerHTML="";
  picks.forEach(function(p){
    var li=document.createElement("li");
    var b=document.createElement("b");b.textContent=p[0];
    var s=document.createElement("span");s.textContent=t(p[1]);
    var c=document.createElement("span");c.className="cats";
    var lab=document.createElement("span");lab.className="lab"+(p[3]==="soon"?" soon":"");
    lab.textContent=p[3]==="soon"?ui("soon"):ui("avail");c.appendChild(lab);
    p[2].forEach(function(cat){var ch=document.createElement("span");
      ch.className="chip"+(p[3]==="soon"?" soon":"");ch.textContent=t(cat);c.appendChild(ch)});
    li.appendChild(b);li.appendChild(s);li.appendChild(c);ul.appendChild(li);
  });
  $("ralso").textContent=ui("also")+t(other.name)+ui("dot");
  $("shop").href=SHOP_URL;
}
$("l-en").onclick=function(){setLang("en")};
$("l-zh").onclick=function(){setLang("zh")};
$("start").onclick=function(){i=0;ans=[];show("quiz");ask()};
$("again").onclick=function(){i=0;ans=[];show("quiz");ask()};
